services:
  - type: web
    name: canary
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # sync:false = value lives ONLY in the Render dashboard (never in git).
      # Add each key there once: Environment → Add Environment Variable.
      - key: SERPAPI_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
