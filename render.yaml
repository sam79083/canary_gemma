services:
  - type: web
    name: canary
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # sync:false = value lives ONLY in the Render dashboard (never in git).
      # Add each key there once: Environment → Add Environment Variable.
      - key: SERPAPI_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Supabase member auth (Google OAuth). Values live ONLY in the
      # Render dashboard — get them from Supabase → Settings → API.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
