services:
  - type: web
    name: canary
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # sync:false = value lives ONLY in the Render dashboard (never in git).
      # Add each key there once: Environment → Add Environment Variable.
      - key: SERPAPI_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Member login (ID/PW checked server-side only). Set both values in
      # the Render dashboard — the app falls back to sam/1227 when unset.
      - key: SAM_ID
        sync: false
      - key: SAM_PW
        sync: false
